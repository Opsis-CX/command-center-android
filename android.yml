name: Build Android App

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets + native plugins
        run: npx cap sync android

      - name: Wire FCM (google-services.json + Gradle plugin)
        run: node scripts/enable-fcm.mjs

      - name: Prepare icon source
        run: mkdir -p assets && cp logo.png assets/logo.png

      - name: Generate app icon (Opsis swirl)
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0b0b0f' --iconBackgroundColorDark '#0b0b0f' --splashBackgroundColor '#0b0b0f' --splashBackgroundColorDark '#0b0b0f'

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: command-center-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
